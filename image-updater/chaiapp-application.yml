# This ArgoCD Application deploys the chai-app and automatically updates its Docker image using ArgoCD Image Updater with Git write-back.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chai-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: chai-app=shubhamm18/chaiapp-devops    #container name from docker hub

    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/argocd-image-updater-git-creds

    argocd-image-updater.argoproj.io/chai-app.update-strategy: latest

    argocd-image-updater.argoproj.io/chai-app.allow-tags: regexp:^v.*   

spec:
  project: default
  source:
    repoURL: https://github.com/shubhamx18/argocd-gitops.git
    targetRevision: main
    path: practicals/chaiapp-manifests    # path of application manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
