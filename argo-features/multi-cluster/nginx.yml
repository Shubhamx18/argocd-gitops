apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-frontend
  namespace: argocd
spec:
  project: frontend-project
  source:
    repoURL: https://github.com/Shubhamx18/argocd-gitops.git
    targetRevision: main
    path: practicals/portfolio-manifest
  destination:
    server: https://kubernetes.default.svc  # add from : argocd cluster list 
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
