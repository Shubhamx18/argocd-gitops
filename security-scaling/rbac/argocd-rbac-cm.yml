apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd

data:
  policy.csv: |
    # =====================================================
    # ROLES
    # =====================================================

    # -------------------------
    # Admin → controlled full access
    # -------------------------
    p, role:admin, applications, get, */*, allow
    p, role:admin, applications, create, */*, allow
    p, role:admin, applications, update, */*, allow
    p, role:admin, applications, delete, */*, allow
    p, role:admin, applications, sync, */*, allow

    p, role:admin, projects, get, *, allow
    p, role:admin, projects, create, *, allow
    p, role:admin, projects, update, *, allow

    p, role:admin, repositories, get, *, allow
    p, role:admin, repositories, create, *, allow

    p, role:admin, clusters, get, *, allow

    # -------------------------
    # Readonly → strict view only
    # -------------------------
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, projects, get, *, allow

    # (NO deny rule → avoids breaking UI)

    # -------------------------
    # Developer → limited deploy access
    # -------------------------
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, update, */*, allow

    p, role:developer, projects, get, *, allow

    # =====================================================
    # USER → ROLE MAPPING
    # =====================================================
    g, shubham, role:admin
    g, alex, role:readonly
    g, gulshankumar, role:developer

  # Default fallback role
  policy.default: role:readonly

  # =====================================================
  # RBAC REFERENCE (for maintainers)
  # =====================================================
  # Format:
  # p, <role>, <resource>, <action>, <object>, <effect>
  # g, <user/group>, <role>

  # Resources:
  # applications | projects | repositories | clusters | accounts

  # Actions:
  # get      → read/view
  # create   → create resource
  # update   → modify resource
  # delete   → remove resource
  # sync     → deploy application
  # override → force sync
  # action   → custom resource actions

  # Object:
  # */*            → all projects / all apps
  # myproject/*    → specific project

  # Effect:
  # allow | deny
