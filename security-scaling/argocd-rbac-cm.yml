apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd

data:
  policy.csv: |
    # =====================================================
    # ROLES
    # =====================================================

    # Admin → full access to everything
    p, role:admin, applications, *, */*, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, clusters, *, *, allow

    # Readonly → view only (strict)
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, applications, *, */*, deny

    # Developer → limited control (safe deploy access)
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, update, */*, allow

    # =====================================================
    # USER → ROLE MAPPING
    # =====================================================

    g, shubham, role:admin
    g, alex, role:readonly
    g, gulshankumar, role:developer

  # Default fallback role
  policy.default: role:readonly

  # =====================================================
  # RBAC REFERENCE (for maintainers)
  # =====================================================
  # Format:
  # p, <role>, <resource>, <action>, <object>, <effect>
  # g, <user/group>, <role>

  # Resources:
  # applications | projects | repositories | clusters | accounts

  # Actions:
  # get      → read/view
  # create   → create resource
  # update   → modify resource
  # delete   → remove resource
  # sync     → deploy application
  # override → force sync
  # action   → custom resource actions

  # Object:
  # */*            → all projects / all apps
  # myproject/*    → specific project

  # Effect:
  # allow | deny
